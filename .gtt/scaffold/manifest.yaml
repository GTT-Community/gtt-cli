# GTT Canonical Scaffold - declarative definition.
#
# Canonical reference: https://github.com/GTT-Community/gtt-method/blob/main/GTT-CANONICAL-v2.1.md
#
# DATA ONLY. No logic lives here and none may be added: the behaviour of each
# component belongs to the Engine (.gtt/scripts/), never to this file. It states
# what the scaffold IS, so that a future `gtt init` (not implemented here) and
# the human reader consume one definition instead of re-deriving the layout.
#
# It is a description of the repository, never a second source of truth: when
# it disagrees with the repository, that is a finding to surface (through
# .gtt/scripts/gtt-validate.sh and the gtt-audit skill), not a value to trust.
# There is exactly ONE scaffold. ADEs contribute overlays to it (see
# `overlays`); they never define one of their own.
#
# Layout version 2: the Engine lives in `.gtt/` (with GTT's own
# documentation in `.gtt/docs/`), the project's governed state in `gtt-domain/`.
# Neither directory holds the other's kind of content: architectural authority
# (L0/L1) exists only in `gtt-domain/context/` and `gtt-domain/adr/`; executable
# GTT logic exists only in `.gtt/`.
#
# Entries are single-line flow mappings so the file stays greppable:
#   path       location relative to the project root (trailing / = directory)
#   required   true = the scaffold is incomplete without it
#   derived    true = regenerated by a script; never hand-edited
#   state      true = written by a governed act, not authored
#   role       what it is for (prose)

scaffold:
  id: gtt-canonical-scaffold
  version: 2                      # scaffold layout version - NOT the GTT version
  canon: GTT-CANONICAL-v2.1

layers:
  engine: .gtt/                   # the GTT implementation and GTT's own documentation; holds no project-governed state
  domain: gtt-domain/             # the domain governed by GTT-Method: its authority (L0/L1), its change flow and its drafts
  overlay: ade-native-paths       # one ADE integration per participating ADE (chosen by the human, recorded in .gtt/ade.json), exactly one of them Primary

engine:
  - { path: .gtt/scripts/, kind: dir, required: true, role: deterministic services and checks (Bash and Python) }
  - { path: .gtt/index/, kind: dir, required: true, role: artifact identity manifest and derived technical index }
  - { path: .gtt/index/artifacts.json, kind: file, required: true, role: identity manifest - authoritative for id to path only }
  - { path: .gtt/index/technical-index.json, kind: file, required: true, derived: true, role: derived accelerator - never a source of truth }
  - { path: .gtt/protection/, kind: dir, required: true, role: GTTGuard registry }
  - { path: .gtt/protection/registry.yaml, kind: file, required: true, derived: true, role: regenerated from source markers - never hand-edited }
  - { path: .gtt/session-adapters/, kind: dir, required: true, role: per-ADE Session Memory declarations (data only) }
  - { path: .gtt/scaffold/manifest.yaml, kind: file, required: true, role: this file }
  - { path: .gtt/scaffold/templates/, kind: dir, required: true, role: Bootstrap-owned templates a CLI may request - see `templates` }
  - { path: .gtt/local/preferences.md, kind: file, required: false, state: true, role: user-level working preferences - local to one person, never committed, never authority; below governed context }
  - { path: .gtt/contract/, kind: dir, required: true, role: Bootstrap 1.0 contracts consumed by the CLI - release identity, compatibility, capabilities, operations, Method Plans (methodology profiles), export policy, recovery, elicitation (data only) }
  - { path: .gtt/contract/release.json, kind: file, required: true, role: Bootstrap release identity (version, schema, channel), CLI compatibility and the version of every contract - distinct from scaffold.version }
  - { path: .gtt/contract/capabilities.json, kind: file, required: true, role: capability registry - what the Bootstrap offers, negotiable by a CLI }
  - { path: .gtt/contract/operations.json, kind: file, required: true, role: operation registry - logical operation to trusted implementation, typed arguments, no arbitrary shell }
  - { path: .gtt/contract/profiles.json, kind: file, required: true, role: Method Plans Light, Medium, Hard, Team - developer-experience policy (minimum friction), operating policy, semantics, gates and the non-relaxable invariants; the single definition of what a plan means }
  - { path: .gtt/contract/export-policy.json, kind: file, required: true, role: clean-export and clean ownership policy }
  - { path: .gtt/contract/recovery.json, kind: file, required: true, role: recovery snapshot schema and restore rules }
  - { path: .gtt/contract/elicitation.json, kind: file, required: true, role: guided ADE elicitation contract for the Initial Design Questionnaire }
  - { path: .gtt/tests/, kind: dir, required: true, role: Bootstrap acceptance tests - drive the contracts on disposable copies; never modify the project }
  - { path: .gtt/methodology.json, kind: file, required: false, state: true, role: per-project Method Plan selected by the human (light, medium, hard, team) and language; absent means not selected; written only by gtt-project.sh }
  - { path: .gtt/selected-sources.json, kind: file, required: false, state: true, role: initial sources selected for the project - selection metadata only, never a governed authority; written only by gtt-project.sh }
  - { path: .gtt/ade.json, kind: file, required: false, state: true, role: per-project ADE state - participating, primary, excluded and the ledger of GTT-installed ADE files; written only by gtt-ade.sh, required in an installed project, absent in the catalog }
  - { path: .gtt/README.md, kind: file, required: false, role: project-facing README of the Engine (installed into host projects; absent in the catalog repository) }
  - { path: .gtt/docs/, kind: dir, required: true, role: GTT documentation - never loaded by any agent, outside the freeze regime }
  - { path: .gtt/docs/index.md, kind: file, required: true, role: map of every file }
  - { path: .gtt/docs/installation.md, kind: file, required: true, role: installation procedures }
  - { path: .gtt/docs/installation.es.md, kind: file, required: true, role: Spanish mirror }
  - { path: .gtt/docs/usage.md, kind: file, required: true, role: the normal development loop }
  - { path: .gtt/docs/usage.es.md, kind: file, required: true, role: Spanish mirror }
  - { path: .gtt/docs/method-plans.md, kind: file, required: true, role: Method Plans in plain words - what each plan delegates, asks, requires and enforces; rendering of contract/profiles.json }
  - { path: .gtt/docs/method-plans.es.md, kind: file, required: true, role: Spanish mirror }
  - { path: .gtt/docs/gtt-completion.md, kind: file, required: true, role: durable bootstrap completion record - append only }
  - { path: .gtt/docs/evidence.md, kind: file, required: true, role: technical claims classified by verification level }
  - { path: .gtt/docs/docs.md, kind: file, required: true, role: methodology and portability }
  - { path: .gtt/docs/session-adapter-contract.md, kind: file, required: true, role: contract every Session Memory adapter must meet }
  - { path: .gtt/docs/bootstrap-contract.md, kind: file, required: true, role: the Bootstrap 1.0 contract for the CLI - what each contract is, where it lives, how it is invoked }

domain:
  - { path: gtt-domain/context/, kind: dir, required: true, role: L0 governed context }
  - { path: gtt-domain/context/stack.md, kind: file, required: true, role: the seven-view architecture map }
  - { path: gtt-domain/context/architecture.md, kind: file, required: true, role: architecture in prose }
  - { path: gtt-domain/context/constraints.md, kind: file, required: true, role: hard limits - the only context file always loaded }
  - { path: gtt-domain/context/principles.md, kind: file, required: true, role: design principles in force }
  - { path: gtt-domain/context/solution-vision.md, kind: file, required: true, role: purpose and non-goals }
  - { path: gtt-domain/context/glossary.md, kind: file, required: true, role: project-specific terms }
  - { path: gtt-domain/context/sources.md, kind: file, required: false, role: source manifest - declared sources with authority and precedence, and the provenance policy; governed like the rest of L0 }
  - { path: gtt-domain/adr/, kind: dir, required: true, role: L1 accepted decisions }
  - { path: gtt-domain/adr/ADR-TEMPLATE.md, kind: file, required: true, role: blank ADR }
  - { path: gtt-domain/proposals/, kind: dir, required: true, role: the one directory an agent may write; governed drafts and promotion packages (a promotion script is run by a human, never by an agent) }
  - { path: gtt-domain/backlog.md, kind: file, required: true, role: development line - Epics and Stories }
  - { path: gtt-domain/working-agreements.md, kind: file, required: false, role: team working agreements - versioned and reviewed, below governed context, never authority and never session memory }
  - { path: gtt-domain/change-request.md, kind: file, required: true, role: front door for change intent }
  - { path: gtt-domain/session.md, kind: file, required: false, derived: true, role: operational-only Session Memory - never authority or evidence }
  - { path: gtt-domain/.frozen, kind: file, required: false, state: true, role: freeze marker written by gtt-freeze.sh after human confirmation }
  - { path: SOURCE-BRIEF.*, kind: glob, required: false, role: original design source preserved by the bootstrap when one existed (kept at the project root) }

entry_points:
  # Instructions to agents and human entry points: in neither the Engine nor the domain.
  - { path: AGENTS.md, kind: file, required: true, role: portable agent contract - also the discovery file some ADEs read }
  - { path: readme-gtt.md, kind: file, required: true, role: human entry point }
  - { path: readme-gtt.es.md, kind: file, required: true, role: Spanish mirror }

overlays:
  # The ADE integration registry: ONE GTT governance model, several integration
  # surfaces. An installed project receives the overlays of the ADEs its human chose
  # to have participate (.gtt/ade.json), exactly one of them Primary - a workflow
  # identifier that carries no authority. The catalog repository ships all of them,
  # which is why none is required here. Keys:
  #   id           ADE identifier; its Session Memory declaration is .gtt/session-adapters/<id>.json
  #   name         display name
  #   path         anchor of the integration (must exist for a participating ADE)
  #   entry        instruction entry point the ADE reads (an integration surface, never an authority)
  #   owned        paths GTT installs for it and the ONLY paths clean / export --clean may remove;
  #                [] = nothing beyond the core entry point
  #   detect       paths whose presence makes the ADE a CANDIDATE - never participation
  #   enforcement  realtime-hook | ci-gate - what actually blocks an ungoverned write for that ADE
  #   scaffold     layout version the overlay is built for
  - { id: claude, name: Claude Code, path: .claude/, entry: .claude/CLAUDE.md, owned: [.claude/], detect: [.claude/, CLAUDE.md], enforcement: realtime-hook, scaffold: 2, version: 1, kind: dir, required: false, role: Claude Code overlay }
  - { id: kiro, name: Kiro, path: .kiro/, entry: .kiro/steering/gtt-guard.md, owned: [.kiro/], detect: [.kiro/], enforcement: ci-gate, scaffold: 2, version: 1, kind: dir, required: false, role: Kiro overlay }
  - { id: copilot, name: GitHub Copilot, path: .copilot/copilot-instructions.md, entry: .copilot/copilot-instructions.md, owned: [.copilot/copilot-instructions.md], detect: [.copilot/, .github/copilot-instructions.md], enforcement: ci-gate, scaffold: 2, version: 1, kind: file, required: false, role: GitHub Copilot overlay }
  - { id: codex, name: Codex, path: AGENTS.md, entry: AGENTS.md, owned: [], detect: [.codex/], enforcement: ci-gate, scaffold: 2, version: 1, kind: file, required: false, role: Codex takes no overlay beyond the core entry point }

templates:
  # Bootstrap-owned templates. The Bootstrap owns each template, its contract and its
  # evolution; a CLI detects the need, requests the template here (gtt-template.sh) and
  # orchestrates - it never carries a copy or the methodology. A materialized copy is
  # source material, never governed context and never a decision. The template's version
  # is the Bootstrap's own: `scaffold` states the layout it was written for.
  #   use             what it is for
  #   when            the condition under which a caller should offer it
  #   materialize_to  where the working copy goes in a project (never overwritten)
  #   becomes         what the filled copy is afterwards
  - { id: initial-design-questionnaire, path: .gtt/scaffold/templates/gtt-initial-design-questionnaire.md, kind: file, required: true, use: ADE-guided design elicitation, when: no sufficient design source document exists, materialize_to: gtt-domain/proposals/bootstrap/initial-design-questionnaire.md, becomes: source-material, scaffold: 2, version: 1, contract_version: 1, role: Initial Design Questionnaire - the instrument that lets a project without a design document reach a Minimum Viable Governed Design }
  - { id: source-manifest, path: .gtt/scaffold/templates/gtt-sources-manifest.md, kind: file, required: false, use: declare authorised sources with authority and precedence, when: more than one design source exists or a provenance policy is wanted, materialize_to: gtt-domain/proposals/bootstrap/sources.md, becomes: governed-context-draft, scaffold: 2, version: 1, contract_version: 1, role: Source manifest template - moved to gtt-domain/context/sources.md before freeze (or through the governed path after it) }
  - { id: working-agreements, path: .gtt/scaffold/templates/gtt-working-agreements.md, kind: file, required: false, use: record how a team prefers to work, when: a team wants written working agreements, materialize_to: gtt-domain/working-agreements.md, becomes: working-agreement, scaffold: 2, version: 1, contract_version: 1, role: Working agreements template - a human requests it; an agent never authors its own preferences }

naming:
  # Lowercase applies to every name this scaffold defines. These follow an external
  # or established convention and are deliberately left as they are:
  exceptions:
    - AGENTS.md            # ADE discovery name; case-sensitive on some platforms
    - SOURCE-BRIEF.*       # preserved-source convention of the bootstrap procedure
    - ADR-*.md             # ADR identity (ADR-NNN)
    - PROPOSAL-*.md        # staged-draft naming under gtt-domain/proposals/
    - CLAUDE.md            # ADE-defined
    - SKILL.md             # ADE-defined
