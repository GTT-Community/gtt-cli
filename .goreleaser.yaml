# GoReleaser configuration: builds the single `gtt` binary per platform and
# publishes it to GitHub Releases when a v* tag is pushed to the public
# repository. Local check: goreleaser release --snapshot --clean
version: 2

project_name: gtt

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: gtt
    main: ./cmd/gtt
    binary: gtt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/GTT-Community/gtt-cli/internal/core.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gtt
    ids: [gtt]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name: releases/latest/download/gtt_<os>_<arch> always
    # points at the newest release, so install instructions never change.
    name_template: "gtt_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc

release:
  github:
    owner: GTT-Community
    name: gtt-cli
  name_template: "gtt {{ .Version }}"
  footer: |
    Install: download the archive for your platform, extract it and put `gtt` (`gtt.exe` on Windows) on your PATH.
    Windows needs Git for Windows, which provides bash, and Python 3 for the GTT Bootstrap scripts.
    Verify with `sha256sum -c checksums.txt --ignore-missing`, then run `gtt version`.
