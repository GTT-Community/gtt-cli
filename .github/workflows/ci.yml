name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and architecture tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Unit and architecture tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test ./internal/... ./test/arch/ 2>&1 | tee test.log || status=$?
          # Failures as annotations: visible on the run page without logs access.
          grep -E -- '--- FAIL|_test\.go:[0-9]+:|^panic:|cannot|not found' test.log | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done || true
          exit $status
      - name: Build
        run: go build -o dist/ ./cmd/gtt

  integration:
    name: Integration tests against GTT Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Bootstrap scripts need LF line endings, also on Windows.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: gtt-cli
      # The integration suite drives the real CLI against a real Bootstrap
      # catalog. The ref can be pinned to a release tag once one is published.
      - uses: actions/checkout@v5
        with:
          repository: GTT-Community/gtt-bootstrap
          path: gtt-bootstrap
      # GTT Bootstrap scripts need Python 3 (on Windows it is not on PATH by default).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v6
        with:
          go-version-file: gtt-cli/go.mod
          cache-dependency-path: gtt-cli/go.sum
      - name: Integration tests
        working-directory: gtt-cli
        env:
          GTT_TEST_BOOTSTRAP: ${{ github.workspace }}/gtt-bootstrap
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test -timeout 55m ./test/integration/ 2>&1 | tee test.log || status=$?
          # Failures as annotations: visible on the run page without logs access.
          grep -E -- '--- FAIL|_test\.go:[0-9]+:|^panic:|cannot|not found' test.log | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done || true
          exit $status

  # The development repository is governed with GTT; the public repository is
  # a clean export without it. The gate runs only where GTT is installed.
  governance:
    name: GTT governance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect GTT
        id: gtt
        run: |
          if [ -f .gtt/contract/release.json ]; then echo "installed=true" >> "$GITHUB_OUTPUT"; else echo "installed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v6
        if: steps.gtt.outputs.installed == 'true'
        with:
          go-version-file: go.mod
      - name: Build
        if: steps.gtt.outputs.installed == 'true'
        run: go build -o dist/gtt ./cmd/gtt
      - name: Validate the governed project
        if: steps.gtt.outputs.installed == 'true'
        run: ./dist/gtt validate --ci
      - name: Check the agent context
        if: steps.gtt.outputs.installed == 'true'
        run: ./dist/gtt agents check --ci
