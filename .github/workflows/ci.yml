name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and architecture tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Unit and architecture tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test ./internal/... ./test/arch/ 2>&1 | tee test.log || status=$?
          # Failures as annotations: visible on the run page without logs access.
          # GitHub keeps 10 annotations per step: the first failure's full output goes first.
          first=$(grep -anE -m1 -- '_test\.go:[0-9]+:|^panic:' test.log | cut -d: -f1 || true)
          if [ -n "$first" ]; then
            block=$(tail -n +"$first" test.log | head -n 60 | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=First failure::${block}"
            { echo '### First failure'; echo '```'; tail -n +"$first" test.log | head -n 120 | tr -d '\r'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -aE -- '--- FAIL|^panic:' test.log | head -8 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done || true
          exit $status
      - name: Build
        run: go build -o dist/ ./cmd/gtt

  integration:
    name: Integration tests against GTT Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows integration needs a Bootstrap that runs its scripts with Git Bash:
    # reports/BUG-bootstrap-windows-wsl-bash.md in gtt-cli-dev. Until it ships,
    # a Windows failure is reported without failing the run.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Bootstrap scripts need LF line endings, also on Windows.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: gtt-cli
      # The integration suite drives the real CLI against a real Bootstrap
      # catalog. The ref can be pinned to a release tag once one is published.
      - uses: actions/checkout@v5
        with:
          repository: GTT-Community/gtt-bootstrap
          path: gtt-bootstrap
      # GTT Bootstrap scripts need Python 3 (on Windows it is not on PATH by default).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v6
        with:
          go-version-file: gtt-cli/go.mod
          cache-dependency-path: gtt-cli/go.sum
      - name: Integration tests
        working-directory: gtt-cli
        env:
          GTT_TEST_BOOTSTRAP: ${{ github.workspace }}/gtt-bootstrap
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test -timeout 55m ./test/integration/ 2>&1 | tee test.log || status=$?
          # Failures as annotations: visible on the run page without logs access.
          # GitHub keeps 10 annotations per step: the first failure's full output goes first.
          first=$(grep -anE -m1 -- '_test\.go:[0-9]+:|^panic:' test.log | cut -d: -f1 || true)
          if [ -n "$first" ]; then
            block=$(tail -n +"$first" test.log | head -n 60 | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=First failure::${block}"
            { echo '### First failure'; echo '```'; tail -n +"$first" test.log | head -n 120 | tr -d '\r'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -aE -- '--- FAIL|^panic:' test.log | head -8 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done || true
          exit $status

  # The development repository is governed with GTT; the public repository is
  # a clean export without it. The gate runs only where GTT is installed.
  governance:
    name: GTT governance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect GTT
        id: gtt
        run: |
          if [ -f .gtt/contract/release.json ]; then echo "installed=true" >> "$GITHUB_OUTPUT"; else echo "installed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v6
        if: steps.gtt.outputs.installed == 'true'
        with:
          go-version-file: go.mod
      - name: Build
        if: steps.gtt.outputs.installed == 'true'
        run: go build -o dist/gtt ./cmd/gtt
      - name: Validate the governed project
        if: steps.gtt.outputs.installed == 'true'
        run: ./dist/gtt validate --ci
      - name: Check the agent context
        if: steps.gtt.outputs.installed == 'true'
        run: ./dist/gtt agents check --ci
