name: Release

# A v* tag on the public repository builds the `gtt` binary for every
# platform and publishes it, with checksums, to GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Releases are published only from the public repository.
    if: github.repository == 'GTT-Community/gtt-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit and architecture tests
        run: go test ./internal/... ./test/arch/
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    # Publishes the npm wrapper (`npm install -g gtt-cli`) once the binaries
    # are released. Needs the repository secret NPM_TOKEN; skipped without it.
    needs: release
    if: github.repository == 'GTT-Community/gtt-cli'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish gtt-cli to npm
        working-directory: npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set: the npm package was not published."
            exit 0
          fi
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm publish --access public
