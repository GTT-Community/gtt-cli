name: Release

# A v* tag on the public repository builds the `gtt` binary for every
# platform and publishes it, with checksums, to GitHub Releases.
on:
  push:
    tags: ["v*"]
  # Re-run the publication of an existing tag (for example after adding a token).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Releases are published only from the public repository.
    if: github.repository == 'GTT-Community/gtt-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit and architecture tests
        run: go test ./internal/... ./test/arch/
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PyPI wheels carrying the same binaries: uv tool install gtt-cli, uvx gtt-cli.
      # Needs the repository secret PYPI_TOKEN; skipped without it.
      - uses: astral-sh/setup-uv@v6
      - name: Publish gtt-cli to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          python3 packaging/pypi/build_wheels.py --dist dist --version "${GITHUB_REF_NAME#v}" --out wheels
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "::warning::PYPI_TOKEN is not set: the PyPI package was not published."
            exit 0
          fi
          uv publish wheels/*.whl

  npm:
    # Publishes the npm wrapper (`npm install -g gtt-cli`) once the binaries
    # are released. Needs the repository secret NPM_TOKEN; skipped without it.
    needs: release
    if: github.repository == 'GTT-Community/gtt-cli'
    runs-on: ubuntu-latest
    env:
      # setup-node puts a placeholder in NODE_AUTH_TOKEN when none is given, so
      # the secret is checked under its own name and exported only when set.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish gtt-cli to npm
        working-directory: npm
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set: the npm package was not published."
            exit 0
          fi
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm publish --access public
