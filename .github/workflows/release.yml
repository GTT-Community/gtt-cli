name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default permissions are read-only.
permissions:
  contents: read

jobs:
  release:
    name: Build and release
    if: github.repository == 'GTT-Community/gtt-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ADR-005: the tag, the source-build version and the Bootstrap pin are one suite number.
      - name: Suite version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base=$(sed -n 's/^const baseVersion = "\(.*\)"$/\1/p' internal/core/identity.go)
          pin=$(sed -n 's/^const BootstrapPin = "\(.*\)"$/\1/p' internal/core/identity.go)
          if [ "$tag" != "$base" ] || [ "$tag" != "$pin" ]; then
            echo "::error title=Suite version::tag $tag, baseVersion $base, BootstrapPin $pin must be equal (ADR-005)"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit and architecture tests
        run: go test ./internal/... ./test/arch/

      - name: Build and publish GitHub Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PyPI wheels
        run: |
          python3 packaging/pypi/build_wheels.py \
            --dist dist \
            --version "${GITHUB_REF_NAME#v}" \
            --out wheels

      - name: Upload PyPI wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/*.whl
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: release
    if: github.repository == 'GTT-Community/gtt-cli'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download PyPI wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/

  npm:
    name: Publish to npm
    needs: release
    if: github.repository == 'GTT-Community/gtt-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish package
        working-directory: npm
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          # `npm view` exits 0 with no output for a version that does not exist: test the output.
          if [ -n "$(npm view "@gtt-community/gtt-cli@${version}" version \
            --registry=https://registry.npmjs.org 2>/dev/null)" ]; then
            echo "gtt-cli@${version} is already published."
            exit 0
          fi

          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not configured."
            exit 1
          fi

          export NODE_AUTH_TOKEN="${NPM_TOKEN}"

          npm pkg set version="${version}"
          npm publish --access public